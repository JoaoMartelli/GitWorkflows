name: Release e Deploy em Producao
on:
  push:
    branches: [ "master", "main" ]
jobs:
  release-e-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
    - name: Baixar código
      uses: actions/checkout@v3
    - name: Criar Release no GitHub
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.0